<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    
    <!-- Primary Golden Amber Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Outer Ring Glow Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" stroke="#27272a" stroke-width="8"/>

  <!-- Subtle Inner Accent Ring -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-dasharray="16 12"/>

  <!-- Central High-Impact Geometric Neural Strength Symbol -->
  <g filter="url(#glow)">
    <!-- Stylized Power Bolt / Energy Core -->
    <path 
      d="M280 68 L140 268 L244 268 L212 444 L372 236 L264 236 Z" 
      fill="url(#goldGrad)"
      stroke="#fef08a"
      stroke-width="4"
      stroke-linejoin="round"
    />
  </g>

  <!-- Precision Calibration Dots -->
  <circle cx="256" cy="40" r="6" fill="#f59e0b"/>
  <circle cx="256" cy="472" r="6" fill="#f59e0b"/>
  <circle cx="40" cy="256" r="6" fill="#f59e0b"/>
  <circle cx="472" cy="256" r="6" fill="#f59e0b"/>
</svg>
