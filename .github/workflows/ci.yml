name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-ci:
    name: Frontend Suite (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: atp-strength-frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./atp-strength-frontend
        run: npm ci

      - name: Security Vulnerability Audit
        working-directory: ./atp-strength-frontend
        run: npm audit --audit-level=high

      - name: ESLint Code Quality Gate (Zero Warnings)
        working-directory: ./atp-strength-frontend
        run: npm run lint

      - name: TypeScript Type-Safety Check
        working-directory: ./atp-strength-frontend
        run: npx tsc --noEmit

      - name: Run 100% Logic & Domain Unit Tests (Node Test Runner)
        working-directory: ./atp-strength-frontend
        run: npm test

      - name: TypeCheck & Build Production Bundle (Next.js Turbopack)
        working-directory: ./atp-strength-frontend
        run: npm run build

  backend-ci:
    name: Backend Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: atp-strength-backend/requirements.txt

      - name: Install dependencies
        working-directory: ./atp-strength-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff Linter Verification
        working-directory: ./atp-strength-backend
        run: python -m ruff check .

      - name: Ruff Code Formatting Check
        working-directory: ./atp-strength-backend
        run: python -m ruff format --check .

      - name: Pytest Domain & API Test Suite
        working-directory: ./atp-strength-backend
        run: pytest tests/ -v
