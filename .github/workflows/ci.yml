name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Test & Build Suite
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: atp-strength-frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./atp-strength-frontend
        run: npm ci

      - name: Run 100% Logic & Domain Unit Tests (Node Test Runner)
        working-directory: ./atp-strength-frontend
        run: npm test

      - name: TypeCheck & Build Production Bundle (Next.js Turbopack)
        working-directory: ./atp-strength-frontend
        run: npm run build
